<script>

    const USER_SESSION_KEY = 'neconecta_user_session'; // 🔑 Chave para salvar a sessão

    // ==================== FUNÇÕES CRÍTICAS DE PERSISTÊNCIA ====================
    
    /**
     * Salva a sessão completa do usuário em localStorage e sessionStorage
     * Isso garante que o login persista mesmo após recarregar a página
     */
    function salvarSessaoCompleta() {
        if (!currentUser) {
            localStorage.removeItem(USER_SESSION_KEY);
            sessionStorage.removeItem(USER_SESSION_KEY);
            return;
        }
        
        const sessao = {
            id: currentUser.id,
            nome: currentUser.nome,
            email: currentUser.email,
            avatar: currentUser.avatar,
            provider: currentUser.provider,
            timestamp: Date.now()
        };
        
        // Salva em AMBOS os storages para dupla proteção
        localStorage.setItem(USER_SESSION_KEY, JSON.stringify(sessao));
        sessionStorage.setItem(USER_SESSION_KEY, JSON.stringify(sessao));
        
        console.log('💾 Sessão salva:', sessao.nome);
    }
    
    /**
     * Restaura a sessão do usuário dos storages locais
     * Retorna true se conseguiu restaurar, false caso contrário
     */
    function restaurarSessao() {
        // Tenta sessionStorage primeiro (mais rápido)
        let sessao = sessionStorage.getItem(USER_SESSION_KEY);
        
        // Se não encontrou, tenta localStorage
        if (!sessao) {
            sessao = localStorage.getItem(USER_SESSION_KEY);
        }
        
        if (sessao) {
            try {
                const dados = JSON.parse(sessao);
                console.log('🔄 Restaurando sessão:', dados.nome);
                
                // Recria o objeto do usuário
                currentUser = {
                    id: dados.id,
                    nome: dados.nome,
                    email: dados.email,
                    avatar: dados.avatar,
                    provider: dados.provider
                };
                
                // Atualiza a interface imediatamente
                atualizarPerfilUI();
                carregarFeedCompleto();
                
                return true;
            } catch (e) {
                console.error('Erro ao restaurar sessão:', e);
            }
        }
        
        return false;
    }

    // ==================== AUTENTICAÇÃO FIREBASE ====================
    
    function initAuth() {

                currentUser = {
                    id: user.uid,
                    nome: user.displayName || user.email?.split('@')[0] || 'Usuário',
                    email: user.email,
                    avatar: user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'User')}&background=7c4dff&color=fff`,
                    provider: 'google'
                };
                
                // 🔑 SALVA A SESSÃO IMEDIATAMENTE
                salvarSessaoCompleta();
                
                // Atualiza a UI
                atualizarPerfilUI();
                carregarFeedCompleto();
                
                console.log('✅ Usuário logado:', currentUser.nome);
            } else {
                // Usuário deslogado
                currentUser = null;
                localStorage.removeItem(USER_SESSION_KEY);
                sessionStorage.removeItem(USER_SESSION_KEY);
                
                atualizarPerfilUI();
                carregarFeedCompleto();
                
                console.log('👋 Usuário deslogado');
            }
        });
    }

    /**
     * Carrega o conteúdo da seção atual
     */
    async function carregarFeedCompleto() {
        console.log(`📂 Carregando seção: ${currentSection}, Logado: ${!!currentUser}`);
        
        switch (currentSection) {
            case 'feed':
                await carregarPosts();
                break;
            case 'empregos':
                await carregarVagas();
                break;
            case 'noticias':
                await carregarNoticias();
                break;
            case 'chat':
                await carregarChat();
                break;
            case 'perfil':
                renderizarPerfil();
                break;
            default:
                await carregarPosts();
        }
    }

    // ==================== LOGIN/LOGOUT ====================
    
    function loginGoogle() {
        Swal.fire({
            title: 'Conectando ao Google...',
            text: 'Você será redirecionado para autenticação.',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });
        
        window.signInWithPopup(window.auth, window.googleProvider)
            .then(() => {
                Swal.close();
                // A UI será atualizada automaticamente pelo onAuthStateChanged
            }).catch((error) => {
                Swal.close();
                console.error('Erro no login:', error);
                if (error.code === 'auth/popup-closed-by-user') {
                    Swal.fire('Login Cancelado', 'A janela de login foi fechada.', 'info');
                } else {
                    Swal.fire('Erro de Autenticação', `Não foi possível realizar o login. (${error.message})`, 'error');
                }
            });
    }

    function logoutGoogle() {
        Swal.fire({
            title: 'Sair da conta?',
            text: "Você será desconectado da plataforma.",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#4b5563',
            confirmButtonText: 'Sim, sair',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                window.signOut(window.auth).then(() => {
                    Swal.fire('Desconectado', 'Você saiu da sua conta com sucesso.', 'success');
                }).catch((error) => {
                    Swal.fire('Erro', 'Não foi possível sair da conta.', 'error');
                });
            }
        });
    }

    // ==================== PROMPT DE LOGIN ====================
    
    function mostrarLoginPrompt(motivo = 'interagir') {
        Swal.fire({
            title: '🔐 Autenticação Necessária',
            html: `
                <div style="text-align: center;">
                    <i class="fas fa-lock" style="font-size: 48px; color: #7c4dff; margin-bottom: 16px;"></i>
                    <p style="margin-bottom: 8px; font-size: 16px;">Você precisa estar logado para ${motivo}.</p>
                    <p style="font-size: 13px; color: #9b9bb3; margin-bottom: 24px;">Faça login com sua conta Google para acessar todos os recursos.</p>
                    <button class="google-login-btn" style="margin-top: 0;" onclick="loginGoogle()">
                        <i class="fab fa-google" style="font-size: 18px;"></i> Entrar com Google
                    </button>
                </div>
            `,
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: 'Cancelar',
            cancelButtonColor: '#4b5563'
        });
    }

    // ==================== UI DO PERFIL ====================
    
    function atualizarPerfilUI() {
        const container = document.getElementById('profileContainer');
        const avatarCriar = document.getElementById('currentUserAvatar');
        const createPostInput = document.getElementById('createPostInput');
        const fotoOption = document.getElementById('fotoOption');
        const videoOption = document.getElementById('videoOption');
        const enqueteOption = document.getElementById('enqueteOption');
        
        if (currentUser) {
            // Usuário logado
            if (container) {
                container.innerHTML = `<img src="${currentUser.avatar}" class="user-photo" onclick="mudarSecao('perfil')" title="${currentUser.nome}" alt="Perfil">`;
            }
            if (avatarCriar) {
                avatarCriar.innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" alt="Avatar">`;
            }
            if (createPostInput) createPostInput.onclick = () => abrirModalCriarPost();
            if (fotoOption) fotoOption.onclick = () => abrirModalCriarPost('foto');
            if (videoOption) videoOption.onclick = () => abrirModalCriarPost('video');
            if (enqueteOption) enqueteOption.onclick = () => abrirModalCriarPost('enquete');
        } else {
            // Usuário não logado
            if (container) {
                container.innerHTML = `<div class="profile-placeholder" onclick="loginGoogle()"><i class="fab fa-google"></i></div>`;
            }
            if (avatarCriar) avatarCriar.innerHTML = '👤';
            if (createPostInput) createPostInput.onclick = () => mostrarLoginPrompt('criar publicações');
            if (fotoOption) fotoOption.onclick = () => mostrarLoginPrompt('adicionar fotos');
            if (videoOption) videoOption.onclick = () => mostrarLoginPrompt('adicionar vídeos');
            if (enqueteOption) enqueteOption.onclick = () => mostrarLoginPrompt('criar enquetes');
        }
    }

    // ==================== CARREGAR POSTS ====================
    
    async function carregarPosts() {
        const container = document.getElementById('postsContainer');
        
        // Mostra skeleton loading
        container.innerHTML = `
            <div class="skeleton-post"><div style="display: flex;"><div class="skeleton-avatar"></div><div style="flex:1"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line-50"></div></div></div><div class="skeleton-line" style="margin-top: 12px;"></div><div class="skeleton-line"></div></div>
            <div class="skeleton-post"><div style="display: flex;"><div class="skeleton-avatar"></div><div style="flex:1"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line-50"></div></div></div><div class="skeleton-line" style="margin-top: 12px;"></div><div class="skeleton-line"></div></div>
            <div class="skeleton-post"><div style="display: flex;"><div class="skeleton-avatar"></div><div style="flex:1"><div class="skeleton-line"></div><div class="skeleton-line skeleton-line-50"></div></div></div><div class="skeleton-line" style="margin-top: 12px;"></div><div class="skeleton-line"></div></div>
        `;
        
        try {
            const res = await fetch(`${API_URL}/cliente06/posts`);
            if (res.ok) {
                posts = await res.json();
                renderizarFeed();
            } else {
                throw new Error('Falha na rede');
            }
        } catch (e) {
            console.error('Erro ao carregar posts:', e);
            container.innerHTML = `
                <div class="loading-spinner">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Erro ao carregar feed</p>
                    <button class="btn-secondary" onclick="carregarPosts()">Tentar novamente</button>
                </div>`;
        }
    }

    function renderizarFeed() {
        const container = document.getElementById('postsContainer');
        const aprovados = posts.filter(p => p.status === 'approved');
        
        if (aprovados.length === 0) {
            container.innerHTML = `
                <div class="login-prompt">
                    <i class="fas fa-newspaper"></i>
                    <h3>✨ Seja o primeiro a postar!</h3>
                    <p>Compartilhe oportunidades, notícias e conecte-se com a comunidade.</p>
                    ${!currentUser ? 
                        '<button class="google-login-btn" onclick="loginGoogle()"><i class="fab fa-google"></i> Entrar para postar</button>' : 
                        '<button class="btn-primary" onclick="abrirModalCriarPost()">Criar primeiro post</button>'}
                </div>`;
            return;
        }
        
        container.innerHTML = aprovados.map(post => renderPost(post)).join('');
    }

    function renderPost(post) {
        const isLiked = currentUser ? (post.likes?.includes(currentUser.id) || false) : false;
        const podeInteragir = currentUser !== null;
        
        return `
            <div class="post-card">
                <div class="post-header">
                    <div class="post-avatar"><img src="${post.author?.avatar || 'https://ui-avatars.com/api/?background=7c4dff&color=fff'}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" alt="Avatar"></div>
                    <div>
                        <div class="post-author">${post.anonymous ? 'Anônimo' : (post.author?.nome || 'Usuário')}</div>
                        <div class="post-time">${formatarData(post.createdAt)}</div>
                    </div>
                </div>
                <div class="post-text">${escapeHtml(post.text || '')}</div>
                ${post.media ? `<div class="post-media">${post.mediaType === 'video' ? `<video controls src="${post.media}"></video>` : `<img src="${post.media}" alt="Post">`}</div>` : ''}
                <div class="post-stats">
                    <span><i class="fas fa-heart"></i> ${post.likes?.length || 0}</span>
                    <span><i class="fas fa-comment"></i> ${post.comments?.length || 0}</span>
                </div>
                <div class="post-actions">
                    <button class="post-action-btn ${isLiked ? 'liked' : ''}" onclick="${podeInteragir ? `likePost(${post.id})` : `mostrarLoginPrompt('curtir publicações')`}">
                        <i class="fas fa-heart"></i> Curtir
                    </button>
                    <button class="post-action-btn" onclick="${podeInteragir ? `abrirComentarios(${post.id})` : `mostrarLoginPrompt('comentar')`}">
                        <i class="fas fa-comment"></i> Comentar
                    </button>
                    <button class="post-action-btn" onclick="compartilharPost()">
                        <i class="fas fa-share"></i> Compartilhar
                    </button>
                </div>
            </div>
        `;
    }

    // ==================== INTERAÇÕES COM POSTS ====================
    
    async function likePost(postId) {
        if (!currentUser) { mostrarLoginPrompt('curtir publicações'); return; }
        try {
            await fetch(`${API_URL}/cliente06/posts/${postId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id })
            });
            carregarPosts();
        } catch (error) {
            console.error('Erro ao curtir:', error);
        }
    }

    function compartilharPost() {
        navigator.clipboard.writeText(window.location.href);
        Swal.fire('🔗 Link copiado!', 'Compartilhe com seus amigos!', 'success');
    }

    // ==================== CRIAÇÃO DE POSTS ====================
    
    function abrirModalCriarPost(tipo = null) {
        if (!currentUser) { mostrarLoginPrompt('criar publicações'); return; }
        mediaType = tipo;
        document.getElementById('mediaUrlGroup').style.display = (tipo === 'foto' || tipo === 'video') ? 'block' : 'none';
        document.getElementById('pollContainer').style.display = tipo === 'enquete' ? 'block' : 'none';
        document.getElementById('postText').value = '';
        document.getElementById('mediaUrl').value = '';
        document.getElementById('createPostModal').style.display = 'flex';
    }

    async function enviarPost() {
        if (!currentUser) { mostrarLoginPrompt('publicar'); return; }
        
        const text = document.getElementById('postText').value;
        const media = document.getElementById('mediaUrl').value;
        const anonymous = document.getElementById('postAnonimo').checked;
        
        if (!text && !media) {
            Swal.fire('Atenção', 'Digite algo ou adicione uma mídia', 'warning');
            return;
        }
        
        const newPost = {
            author: { id: currentUser.id, nome: currentUser.nome, avatar: currentUser.avatar },
            anonymous,
            text,
            media: media || null,
            mediaType: mediaType === 'foto' ? 'image' : (mediaType === 'video' ? 'video' : null),
            likes: [],
            comments: [],
            shares: 0,
            status: 'pending',
            createdAt: new Date().toISOString()
        };
        
        Swal.fire({
            title: 'Enviando...',
            text: 'Seu post foi enviado para aprovação',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });
        
        try {
            const res = await fetch(`${API_URL}/cliente06/posts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });
            Swal.close();
            if (res.ok) {
                Swal.fire('Sucesso!', 'Post enviado para aprovação!', 'success');
                fecharModal();
                carregarPosts();
            } else {
                Swal.fire('Erro', 'Não foi possível criar o post', 'error');
            }
        } catch (e) {
            Swal.close();
            Swal.fire('Erro', e.message, 'error');
        }
    }

    // ==================== NAVEGAÇÃO ====================
    
    function mudarSecao(section) {
        currentSection = section;
        
        // Atualiza menu
        document.querySelectorAll('.menu a').forEach(a => a.classList.remove('active'));
        document.querySelector(`.menu a[data-section="${section}"]`)?.classList.add('active');
        
        // Atualiza bottom nav
        document.querySelectorAll('.bottom-nav-item').forEach(i => i.classList.remove('active'));
        document.querySelector(`.bottom-nav-item[data-section="${section}"]`)?.classList.add('active');
        
        // Mostra/esconde seções
        document.getElementById('feedCentral').style.display = section === 'feed' ? 'block' : 'none';
        document.getElementById('vagasContainer').style.display = section === 'empregos' ? 'block' : 'none';
        document.getElementById('noticiasContainer').style.display = section === 'noticias' ? 'block' : 'none';
        document.getElementById('perfilContainer').style.display = section === 'perfil' ? 'block' : 'none';
        document.getElementById('chatLayout').style.display = section === 'chat' ? 'flex' : 'none';
        
        // Carrega conteúdo
        carregarFeedCompleto();
        
        // Fecha menu mobile se aberto
        if (window.innerWidth <= 768) {
            document.getElementById('mainMenu')?.classList.remove('show');
        }
    }

    // ==================== UTILITÁRIOS ====================
    
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    
    function formatarData(d) {
        if (!d) return 'agora';
        const date = new Date(d);
        const diff = Math.floor((Date.now() - date) / 1000);
        if (diff < 60) return 'agora';
        if (diff < 3600) return `${Math.floor(diff / 60)}min`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
        if (diff < 2592000) return `${Math.floor(diff / 86400)}d`;
        return date.toLocaleDateString('pt-BR');
    }
    
    function fecharModal() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    // ==================== THEME ====================
    
    function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('floatingThemeBtn').innerHTML = '<i class="fas fa-sun"></i>';
        }
    }
    
    document.getElementById('floatingThemeBtn')?.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        document.getElementById('floatingThemeBtn').innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // ==================== EVENTOS ====================
    
    document.getElementById('notificationBtn')?.addEventListener('click', () => {
        Swal.fire('Notificações', `📢 ${posts.filter(p => p.status === 'pending').length} posts pendentes`, 'info');
    });
    
    document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
        document.getElementById('mainMenu')?.classList.toggle('show');
    });
    
    document.querySelectorAll('.menu a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            mudarSecao(link.getAttribute('data-section'));
        });
    });
    
    document.querySelectorAll('.bottom-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            mudarSecao(btn.getAttribute('data-section'));
        });
    });
    
    window.onclick = (e) => {
        if (e.target.classList.contains('modal')) fecharModal();
    };
    
    const scrollTop = document.getElementById('scrollTop');
    window.addEventListener('scroll', () => {
        scrollTop?.classList.toggle('visible', window.scrollY > 300);
    });
    scrollTop?.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ==================== INICIALIZAÇÃO ====================
    
    function inicializar() {
        console.log('🚀 Inicializando NE Conecta...');
        
        // 1. Configura o tema
        initTheme();
        
        // 2. 🔑 TENTA RESTAURAR A SESSÃO PRIMEIRO (antes do Firebase)
        const sessaoRestaurada = restaurarSessao();
        
        if (sessaoRestaurada) {
            console.log('✅ Sessão restaurada com sucesso!');
        } else {
            console.log('🔄 Nenhuma sessão salva, aguardando login...');
        }
        
        // 3. Configura o listener do Firebase (sincronização)
        initAuth();
        
        // 4. Carrega o feed inicial se necessário
        if (!sessaoRestaurada) {
            carregarPosts();
        }
        
        console.log('✅ Sistema inicializado. Persistência ativa!');
    }

    // Inicia quando o DOM estiver pronto
    document.addEventListener('DOMContentLoaded', inicializar);
</script>
</body>
</html>
